name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest

      # 回归评测（需 API key）M3 起单独接入：
      # 只跑便宜模型、限制 case 数、设预算熔断，避免 CI 成本失控
