name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest

  # 真实链路评测（M3 第 4 周接入）：secrets 未配置时 case 自动跳过（skipif），
  # 配置后按预算熔断跑——只花得起的钱，熔断后余下 case 记失败并照常出报告
  evals:
    runs-on: ubuntu-latest
    needs: lint-test
    env:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      ERPILOT_EVAL_BUDGET: "0.05" # CI 单轮预算上限（元）
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Regression evals
        run: uv run pytest packages/evals -m eval

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/evals/
          if-no-files-found: ignore
