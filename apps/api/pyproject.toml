[project]
name = "erpilot-api"
version = "0.1.0"
description = "FastAPI 服务：agent 宿主、会话管理、SSE 流式接口"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sse-starlette>=2",
    "uvicorn[standard]>=0.30",
    "agent-core",
    "mcp-erp",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.6",
]

[tool.uv.sources]
agent-core = { workspace = true }
mcp-erp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erpilot_api"]
