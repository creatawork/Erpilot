[project]
name = "agent-core"
version = "0.1.0"
description = "手写 agent loop：流式、工具调用、结构化输出（不依赖任何业务包）"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.13",
    "openai>=1.40",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Langfuse 双写（observability.py）按需安装：uv sync --package agent-core --extra langfuse
langfuse = ["langfuse>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]
