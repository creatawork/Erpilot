[project]
name = "mcp-erp"
version = "0.1.0"
description = "FastMCP Server：把 mini-ERP（商品/库存/订单）暴露为 MCP 工具"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2",
    "agent-core",
    "erp-store",
    "rag",
]

[tool.uv.sources]
agent-core = { workspace = true }
erp-store = { workspace = true }
rag = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_erp"]
