[project]
name = "erpilot-cli"
version = "0.1.0"
description = "Erpilot CLI：typer + rich 流式对话（默认经 MCP 查真数据）"
requires-python = ">=3.12"
dependencies = [
    "agent-core",
    "mcp-erp",
    "erp-store",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
erpilot = "erpilot_cli.main:main"

[tool.uv.sources]
agent-core = { workspace = true }
mcp-erp = { workspace = true }
erp-store = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erpilot_cli"]
