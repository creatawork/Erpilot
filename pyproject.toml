[project]
name = "erpilot"
version = "0.1.0"
description = "Erpilot —— 会请示的 ERP 智能体（approval-aware ERP agent，求职作品集项目）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/api", "apps/cli"]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
addopts = "-q -m 'not eval'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    # 真实链路评测（packages/evals/tests/test_evals_live.py）：显式 -m eval 运行，烧 token
    "eval: 真实链路评测，需 API key，有预算熔断（ERPILOT_EVAL_BUDGET）",
]
